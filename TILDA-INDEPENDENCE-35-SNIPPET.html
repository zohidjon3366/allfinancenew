<!-- ALL FINANCE — Mustaqillik 35 yilligi dekor snippet. Tilda Zero/HTML block ichiga qo'yiladi. -->
<style>
:root{--uz-blue:#1b8eea;--uz-green:#17ad65;--uz-red:#e23b3b;--uz-gold:#d8aa45;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle at 92% 12%,rgba(27,142,234,.13),transparent 24%),radial-gradient(circle at 90% 72%,rgba(23,173,101,.12),transparent 24%);}
.t-rec:first-of-type{position:relative;overflow:hidden;}
.t-rec:first-of-type:before{content:"";position:absolute;right:-10vw;bottom:-86px;width:min(820px,72vw);height:330px;border-radius:50%;background:linear-gradient(172deg,transparent 0 21%,rgba(27,142,234,.70) 21% 31%,#fff 31% 39%,rgba(226,59,59,.70) 39% 43%,#fff 43% 52%,rgba(23,173,101,.70) 52% 64%,transparent 64% 100%);transform:rotate(-12deg);filter:drop-shadow(0 24px 42px rgba(18,59,139,.14));opacity:.86;pointer-events:none;}
.af-ind35-badge{position:absolute;right:5vw;top:70px;width:280px;min-height:128px;border-radius:32px;padding:22px;text-align:center;color:#0d3275;background:rgba(255,255,255,.84);border:1px solid rgba(18,59,139,.12);box-shadow:0 24px 70px rgba(14,93,199,.14);z-index:5;pointer-events:none;}
.af-ind35-badge:before{content:"35";display:block;font-size:92px;line-height:.8;font-weight:1000;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:2px #0e5dc7;background:linear-gradient(145deg,#0f5ed0,#1da4ef 38%,#fff 39% 54%,#17ad65 55% 100%);-webkit-background-clip:text;background-clip:text;}
.af-ind35-badge:after{content:"";display:block;width:70%;height:12px;margin:12px auto 8px;border-radius:999px;background:linear-gradient(90deg,var(--uz-blue),#fff 34%,var(--uz-red) 42%,#fff 52%,var(--uz-green));box-shadow:0 10px 20px rgba(18,59,139,.14);}
.af-ind35-badge span{display:block;font-size:13px;line-height:1.25;font-weight:900;letter-spacing:.04em;text-transform:uppercase;}
@media(max-width:980px){.af-ind35-badge{display:none}.t-rec:first-of-type:before{opacity:.45;}}
</style>
<script>
(function(){
  var first=document.querySelector('.t-rec');
  if(!first || document.querySelector('.af-ind35-badge')) return;
  var b=document.createElement('div');
  b.className='af-ind35-badge';
  b.innerHTML='<span>O‘zbekiston Respublikasi Mustaqilligining 35 yilligi</span>';
  first.appendChild(b);
})();
</script>
